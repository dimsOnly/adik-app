name: AdikApp Android CI

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:

    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Checkout source code
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # 2. Setup JDK 17
      # ==========================================
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # ==========================================
      # 3. Setup Gradle
      # ==========================================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # ==========================================
      # 4. Give Gradle Wrapper permission
      # ==========================================
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ==========================================
      # 5. Check Gradle installation
      # ==========================================
      - name: Check Gradle version
        run: ./gradlew --version

      # ==========================================
      # 6. Run unit tests
      # ==========================================
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      # ==========================================
      # 7. Build Debug APK
      # ==========================================
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      # ==========================================
      # 8. Upload Debug APK as Artifact
      # ==========================================
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AdikApp-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      # ==========================================
      # 9. Build Release APK
      # ==========================================
      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      # ==========================================
      # 10. Upload Release APK as Artifact
      # ==========================================
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: AdikApp-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      # ==========================================
      # 11. Upload mapping/proguard files if exists
      # ==========================================
      - name: Upload Release Build Information
        uses: actions/upload-artifact@v4
        with:
          name: AdikApp-release-build-info
          path: |
            app/build/outputs/mapping/release/**
            app/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 30

      # ==========================================
      # 12. Create GitHub Release
      # ==========================================
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: false
